[workspace]
resolver = "2"
members = ["host", "methods", "methods/guest", "methods/compat", "methods/inclusion", "methods/steps"]

[workspace.dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
risc0-build = "=3.0.5"
# Helios at a pinned commit (a16z/helios master, 2026-11-10).
helios-consensus-core = { git = "https://github.com/a16z/helios", rev = "2922a475ef1b48476983333cbae7fc92fdb46cd6" }
bls12_381 = { version = "0.8.0", features = ["experimental"] }
alloy-primitives = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1

# RISC Zero-maintained accelerated forks, plus the patch Helios itself applies.
# Helios with our two-hook patch (helios-patch/0001-split-signature-check.patch).
[patch."https://github.com/a16z/helios"]
helios-consensus-core = { path = "../helios-patched/ethereum/consensus-core" }

[patch.crates-io]
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
sha2-v0-9-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.9.9-risczero.0" }
sha2-v0-10-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.10.9-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
# LEZ v0.4.0-rc3 applies this patch in its own workspace.
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }
