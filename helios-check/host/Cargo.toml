[package]
name = "helios-check"
version = "0.1.0"
edition = "2021"

[dependencies]
helios-check-methods = { path = "../methods" }
risc0-zkvm = { version = "=3.0.5" }
helios-consensus-core.workspace = true
alloy-primitives.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
tree_hash = "0.10"
sha2 = "0.10"
alloy = { version = "2.5", default-features = false, features = ["rpc-types", "consensus", "eips"] }
alloy-trie = "0.9"
alloy-rlp = "0.3"
helios-check-steps = { path = "../methods/steps" }
ssz = { package = "ethereum_ssz", version = "0.9" }
# Signs the synthetic updates of `nonsigners`.
blst = "0.3.16"
